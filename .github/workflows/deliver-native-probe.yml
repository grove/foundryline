name: Temporary issue 18 coding-candidate native qualification

# One bounded push-triggered native qualification; removed before PR publication.
on:
  push:
    branches: [feat/deliver-agent-qualification]
    paths: [.github/workflows/deliver-native-probe.yml]

permissions:
  contents: read

jobs:
  native:
    name: Model-free Proofline check on macOS
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - name: Check out frozen coding-agent implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          ref: 01d2db090713a8852a66d1dfddca90bf7cac548a
          persist-credentials: false
      - name: Check out exact Proofline runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grove/proofline
          ref: 8e117fff4de2459637fe7f74f47ab17fc3341d84
          path: tool
          persist-credentials: false
      - name: Python 3.12 on macOS
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Node 22 for Codex package
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - name: Install exactly Codex CLI 0.162.1
        run: |
          set -euo pipefail
          npm install -g @openai/codex@0.162.1 --ignore-scripts --no-audit --no-fund
          codex --version
          test "$(codex --version)" = "codex-cli 0.162.1"

      - name: Use installed native Codex binary instead of the Node wrapper
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) triple=aarch64-apple-darwin ;;
            x86_64) triple=x86_64-apple-darwin ;;
            *) echo "Unsupported macOS architecture"; exit 1 ;;
          esac
          # Codex's npm entrypoint starts with /usr/bin/env node, which is not
          # available inside Proofline's intentionally restricted sandbox.
          # The identical-version native Mach-O binary is installed as an
          # optional dependency; use it directly without changing permissions.
          module_root="$(npm root -g)"
          native="$(find "$module_root/@openai" -type f \
            -path "*/vendor/$triple/bin/codex" -print -quit)"
          test -n "$native"
          test -x "$native"
          mkdir -p "$RUNNER_TEMP/native-codex-bin"
          ln -s "$native" "$RUNNER_TEMP/native-codex-bin/codex"
          echo "$RUNNER_TEMP/native-codex-bin" >> "$GITHUB_PATH"
          "$native" --version
          test "$("$native" --version)" = "codex-cli 0.162.1"

      - name: Record frozen candidate and exact selected command
        shell: bash
        env:
          WORK: ${{ runner.temp }}/foundryline-deliver-native
          SRC: ${{ github.workspace }}/source
          TOOL: ${{ github.workspace }}/tool
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$WORK"
          cp "$SRC/examples/manual-deliver/agent-qualification/approved-task.md" "$WORK/source-S1.txt"
          test -z "$(git -C "$SRC" status --porcelain)"
          python3 -B - <<'PYSETUP'
          import hashlib,json,os,platform,subprocess,sys
          from pathlib import Path
          root=Path(os.environ["WORK"])
          python=str(Path(sys.executable).resolve())
          argv=[python,"-B","-m","unittest","discover","-s","checks","-v"]
          (root/"checks.json").write_text(json.dumps([argv],indent=2)+"\n")
          (root/"negative-checks.json").write_text(json.dumps([["/nonexistent/foundryline-negative-check"]])+"\n")
          def git(path,ref):
              return subprocess.check_output(["git","-C",path,"rev-parse",ref],text=True).strip()
          data={"host":platform.platform(),"run_id":os.environ["GITHUB_RUN_ID"],
                "event":os.environ["GITHUB_EVENT_NAME"],
                "foundryline_commit":git(os.environ["SRC"],"HEAD"),
                "foundryline_tree":git(os.environ["SRC"],"HEAD^{tree}"),
                "proofline_commit":git(os.environ["TOOL"],"HEAD"),
                "selected_argv":argv,"python":sys.version,
                "source_sha256":hashlib.sha256((root/"source-S1.txt").read_bytes()).hexdigest(),
                "codex":subprocess.check_output(["codex","--version"],text=True).strip(),
                "model_use":"NONE: Proofline check-only; coding agent is external",
                "saved_intentline_export":"NONE",
                "coding_agent_execution":"Active user-authorized Codex session; see implementation commit and original request"}
          assert data["foundryline_commit"]=="01d2db090713a8852a66d1dfddca90bf7cac548a"
          assert data["foundryline_tree"]=="62f8517b004ba4c80b69da3f6e915cb5cab8518f"
          (root/"identity.json").write_text(json.dumps(data,indent=2)+"\n")
          PYSETUP

      - name: Run genuine native check and an unavailable-command control
        shell: bash
        env:
          WORK: ${{ runner.temp }}/foundryline-deliver-native
          TOOL: ${{ github.workspace }}/tool
          SRC: ${{ github.workspace }}/source
        run: |
          set -euo pipefail
          PYTHON="$(python3 -B -c 'import os,sys;print(os.path.realpath(sys.executable))')"
          cd "$TOOL"
          set +e
          "$PYTHON" -B proofline.py check --repo "$SRC" \
            --source "$WORK/source-S1.txt" --checks "$WORK/checks.json" \
            --seconds 240 --check-seconds 70 --output "$WORK/native-record" \
            >"$WORK/native.stdout" 2>"$WORK/native.stderr"
          native_exit=$?
          if test -f "$WORK/native-record/report.json"; then
            "$PYTHON" -B proofline.py status "$WORK/native-record/report.json" \
              >"$WORK/native-status.stdout" 2>"$WORK/native-status.stderr"
            status_exit=$?
            printf '%s\n' "$status_exit" > "$WORK/native-status.exit"
          fi
          "$PYTHON" -B proofline.py check --repo "$SRC" \
            --source "$WORK/source-S1.txt" --checks "$WORK/negative-checks.json" \
            --seconds 100 --check-seconds 25 --output "$WORK/negative-record" \
            >"$WORK/negative.stdout" 2>"$WORK/negative.stderr"
          negative_exit=$?
          set -e
          printf '%s\n' "$native_exit" > "$WORK/native.exit"
          printf '%s\n' "$negative_exit" > "$WORK/negative.exit"

      - name: Inspect actual native result and retain frozen Git identity
        shell: bash
        env:
          WORK: ${{ runner.temp }}/foundryline-deliver-native
        run: |
          python3 -B - <<'PYRESULT'
          import json,os,subprocess
          from pathlib import Path
          root=Path(os.environ["WORK"])
          for prefix in ("native","negative"):
              report=json.loads((root/(prefix+"-record/report.json")).read_text())
              product=root/(prefix+"-record/inputs/product")
              subprocess.run(["git","-C",str(product),"bundle","create",str(root/(prefix+"-candidate.bundle")),"--all"],check=True)
              expected="CHECKS PASSED" if prefix=="native" else "CHECKS UNAVAILABLE"
              assert report["status"]==expected,report
              assert report["boundary"]["assessment"]["status"]=="OBSERVED"
              assert report["candidate_tree"]=="62f8517b004ba4c80b69da3f6e915cb5cab8518f"
              assert report["model_dispatches"]==0
              assert (root/(prefix+".exit")).read_text().strip()==("0" if prefix=="native" else "2")
          PYRESULT

      - name: Preserve the observed result or blocked attempt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundryline-deliver-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foundryline-deliver-native/
          retention-days: 7
          if-no-files-found: warn
