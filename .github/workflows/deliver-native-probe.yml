name: Temporary Deliver Proofline native check qualification

# PR-only attempt. Remove this one-time macOS probe after inspecting results.
on:
  pull_request:
    paths:
      - ".github/workflows/deliver-native-probe.yml"

permissions:
  contents: read

jobs:
  native:
    name: Model-free Proofline check on macOS
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - name: Check out Foundryline authored source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - name: Check out exact Proofline runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grove/proofline
          ref: 8e117fff4de2459637fe7f74f47ab17fc3341d84
          path: tool
          persist-credentials: false
      - name: Python 3.12 on macOS
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Node 22 for Codex package
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - name: Install exactly Codex CLI 0.162.1
        run: |
          set -euo pipefail
          npm install -g @openai/codex@0.162.1 --ignore-scripts --no-audit --no-fund
          codex --version
          test "$(codex --version)" = "codex-cli 0.162.1"

      - name: Use installed native Codex binary instead of the Node wrapper
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) triple=aarch64-apple-darwin ;;
            x86_64) triple=x86_64-apple-darwin ;;
            *) echo "Unsupported macOS architecture"; exit 1 ;;
          esac
          # Codex's npm entrypoint starts with /usr/bin/env node, which is not
          # available inside Proofline's intentionally restricted sandbox.
          # The identical-version native Mach-O binary is installed as an
          # optional dependency; use it directly without changing permissions.
          module_root="$(npm root -g)"
          native="$(find "$module_root/@openai" -type f \
            -path "*/vendor/$triple/bin/codex" -print -quit)"
          test -n "$native"
          test -x "$native"
          mkdir -p "$RUNNER_TEMP/native-codex-bin"
          ln -s "$native" "$RUNNER_TEMP/native-codex-bin/codex"
          echo "$RUNNER_TEMP/native-codex-bin" >> "$GITHUB_PATH"
          "$native" --version
          test "$("$native" --version)" = "codex-cli 0.162.1"

      - name: Prepare disposable Git candidate and exact R1 command
        shell: bash
        env:
          WORK: ${{ runner.temp }}/foundryline-deliver-native
          SRC: ${{ github.workspace }}/source
          TOOL: ${{ github.workspace }}/tool
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$WORK/candidate"
          cp -R "$SRC/examples/manual-deliver/candidate/." "$WORK/candidate/"
          cp "$SRC/examples/manual-deliver/original-request.md" "$WORK/source-S1.txt"
          git -C "$WORK/candidate" init -q
          git -C "$WORK/candidate" add -A
          git -C "$WORK/candidate" -c user.name="Fixture Only" -c user.email="fixture@example.invalid" commit -qm "freeze example"
          python3 -B - <<'PY'
          import hashlib,json,os,platform,subprocess,sys
          from pathlib import Path
          root=Path(os.environ["WORK"])
          python=str(Path(sys.executable).resolve())
          argv=[python,"-B","-m","unittest","tests.test_username_validation.UsernameValidationTests.test_rejects_blank"]
          raw=(root/"source-S1.txt").read_bytes()
          if hashlib.sha256(raw).hexdigest()!="12ee949075e5faaf1d260055cc0ffe193b0c18259f68a06d4e4b4d81b1f0a9b6":
              raise SystemExit("Input source identity mismatch")
          (root/"checks.json").write_text(json.dumps([argv],indent=2)+"\n")
          (root/"negative-checks.json").write_text(json.dumps([["/nonexistent/foundryline-negative-check"]])+"\n")
          data={
            "host":platform.platform(),
            "run_id":os.environ["GITHUB_RUN_ID"],
            "event":os.environ["GITHUB_EVENT_NAME"],
            "foundryline_commit":subprocess.check_output(["git","-C",os.environ["SRC"],"rev-parse","HEAD"],text=True).strip(),
            "proofline_commit":subprocess.check_output(["git","-C",os.environ["TOOL"],"rev-parse","HEAD"],text=True).strip(),
            "candidate_commit":subprocess.check_output(["git","-C",str(root/"candidate"),"rev-parse","HEAD"],text=True).strip(),
            "selected_argv":argv,
            "python":python,"codex":subprocess.check_output(["codex","--version"],text=True).strip(),
            "model_use":"NONE: Proofline check-only",
            "saved_intentline_export":"NONE",
            "coding_agent_execution":"NOT OBSERVED"
          }
          (root/"identity.json").write_text(json.dumps(data,indent=2)+"\n")
          PY

      - name: Run genuine native check and an unavailable-command control
        shell: bash
        env:
          WORK: ${{ runner.temp }}/foundryline-deliver-native
          TOOL: ${{ github.workspace }}/tool
        run: |
          set -euo pipefail
          PYTHON="$(python3 -B -c 'import os,sys;print(os.path.realpath(sys.executable))')"
          cd "$TOOL"
          set +e
          "$PYTHON" -B proofline.py check --repo "$WORK/candidate" \
            --source "$WORK/source-S1.txt" --checks "$WORK/checks.json" \
            --seconds 240 --check-seconds 70 --output "$WORK/native-record" \
            >"$WORK/native.stdout" 2>"$WORK/native.stderr"
          native_exit=$?
          if test -f "$WORK/native-record/report.json"; then
            "$PYTHON" -B proofline.py status "$WORK/native-record/report.json" \
              >"$WORK/native-status.stdout" 2>"$WORK/native-status.stderr"
            status_exit=$?
            printf '%s\n' "$status_exit" > "$WORK/native-status.exit"
          fi
          "$PYTHON" -B proofline.py check --repo "$WORK/candidate" \
            --source "$WORK/source-S1.txt" --checks "$WORK/negative-checks.json" \
            --seconds 100 --check-seconds 25 --output "$WORK/negative-record" \
            >"$WORK/negative.stdout" 2>"$WORK/negative.stderr"
          negative_exit=$?
          set -e
          printf '%s\n' "$native_exit" > "$WORK/native.exit"
          printf '%s\n' "$negative_exit" > "$WORK/negative.exit"

      - name: Independently check native result before reporting success
        shell: bash
        env:
          WORK: ${{ runner.temp }}/foundryline-deliver-native
        run: |
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["WORK"])
          path=root/"native-record/report.json"
          if not path.is_file():raise SystemExit("EXECUTION UNAVAILABLE: no native report")
          report=json.loads(path.read_text())
          status=report.get("status")
          print("Actual native status:",status)
          if report.get("kind")!="bounded_local_check" or status!="CHECKS PASSED":
              raise SystemExit("Native check not qualified; preserve receipts")
          if (root/"native.exit").read_text().strip()!="0":
              raise SystemExit("Native CLI returned nonzero")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("## Native Proofline check-only observation\n\n")
              out.write("**CHECKS PASSED** for the single selected R1 test. ")
              out.write("R2 is **NOT DEMONSTRATED** by this selected check; ")
              out.write("completeness is UNKNOWN. No coding agent, Intentline export, ")
              out.write("PR publication or model call occurred.\n\n")
              neg=root/"negative-record/report.json"
              out.write("**Negative control:** "+(str(json.loads(neg.read_text()).get("status")) if neg.exists() else "No native report; see captured stderr/exit")+"\n")
          PY

      - name: Preserve the observed result or blocked attempt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundryline-deliver-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foundryline-deliver-native/
          retention-days: 7
          if-no-files-found: warn
