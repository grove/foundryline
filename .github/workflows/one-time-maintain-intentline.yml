name: One-time Foundryline v0.2 Maintain adoption replication

# Experiment only, on a disposable feature branch. Never lands on main.
on:
  push:
    branches: [experiment/v020-maintain-intentline-replication]
    paths: [".github/workflows/one-time-maintain-intentline.yml"]

permissions:
  contents: read

jobs:
  replicate:
    name: Run real pinned RepoTend audits on Intentline without changes
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout one-time experiment driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: driver
          persist-credentials: false
      - name: Checkout immutable published Foundryline v0.2.0 guide
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grove/foundryline
          ref: 8409eebe0389461ec60a4bef6a5ce2aec6fb0903
          path: guide
          persist-credentials: false
      - name: Checkout historical pinned RepoTend auditor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grove/repotend
          ref: 2d69cce901475380775f674b9cc5755f1f89f82e
          path: tool
          persist-credentials: false
      - name: Checkout pinned Intentline target, never execute its code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grove/intentline
          ref: 25e926f57e69395193fc0ac258f9e6dd2332cb18
          path: target
          persist-credentials: false
      - name: Node 22.20.0 — compatible with RepoTend v0.1.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.20.0'
      - name: Capture actual setup, both audits, refusal, unchanged target and source clues
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -B driver/tools/one_time_maintain_intentline.py
      - name: Always archive raw captured commands and output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: intentline-maintain-v020-independent-replication
          path: receipts/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
