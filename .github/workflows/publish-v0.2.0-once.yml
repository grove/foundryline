name: One-time Foundryline v0.2.0 publication

# Runs only when this temporary workflow is merged to main.
# The release tag must point at the accepted source, not this automation commit.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.2.0-once.yml"

permissions:
  contents: write

concurrency:
  group: foundryline-publish-v0.2.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'grove/foundryline' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: grove/foundryline
      RELEASE_TAG: v0.2.0
      RELEASE_TARGET: 8409eebe0389461ec60a4bef6a5ce2aec6fb0903

    steps:
      - name: Check out exact accepted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 8409eebe0389461ec60a4bef6a5ce2aec6fb0903
          persist-credentials: false

      - name: Validate exact commit, original native ZIP and 41 reference checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_TARGET"
          test "$(git rev-parse 'HEAD^{tree}')" = "bffa35b780e1a8226af2494c7f052c8f58dfee1e"
          test "$(git rev-parse HEAD:examples/manual-deliver/receipts/repotend-issue15-native-39123644533.zip)" = "a33a6fa58fb13bb25f96393cb43c157799a479c2"
          actual="$(sha256sum examples/manual-deliver/receipts/repotend-issue15-native-39123644533.zip | cut -d ' ' -f 1)"
          test "$actual" = "31f8eb7ce91eb2a647a2e6af4e12050dddb47a3a73df619c7c24c8410c1883e8"
          python3 -B -m unittest discover -s checks -q

      - name: Build verified public release notes with tag-pinned local links
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path
          import os
          import posixpath
          import re

          source = Path("docs/releases/v0.2.0.md").read_text(encoding="utf-8")
          begin = "## What is Foundryline?"
          end = "## Release decision checklist"
          if source.count(begin) != 1 or source.count(end) != 1 or source.index(begin) >= source.index(end):
              raise SystemExit("The reviewed v0.2.0 release-note sections changed")
          body = "# Foundryline v0.2.0 — Three Manual Blueprints\n\n"
          body += source[source.index(begin):source.index(end)].strip()
          body = body.replace("This release candidate deliberately", "This release deliberately")

          def tag_pin(match):
              destination = match.group(1)
              if destination.startswith(("https://", "http://", "#", "mailto:")):
                  return match.group(0)
              relative, sep, anchor = destination.partition("#")
              if not relative or relative.startswith("/") or "://" in relative:
                  raise ValueError(f"Invalid release-note destination: {destination}")
              path = posixpath.normpath(posixpath.join("docs/releases", relative))
              if path in ("", ".", "..") or path.startswith("../") or not Path(path).is_file():
                  raise ValueError(f"Unsafe/unavailable release-note file: {destination}")
              return "](https://github.com/grove/foundryline/blob/v0.2.0/" + path + (sep + anchor if sep else "") + ")"

          body = re.sub(r"\]\(([^)\s]+)\)", tag_pin, body)
          for path in (
              "patterns/discover.md",
              "patterns/maintain.md",
              "patterns/deliver.md",
              "docs/maintain-v0.2-qualification-review.md",
              "docs/deliver-v0.2-qualification-review.md",
              "examples/manual-deliver/receipts/repotend-issue15-native-39123644533.zip",
          ):
              link = "https://github.com/grove/foundryline/blob/v0.2.0/" + path
              if link not in body:
                  raise SystemExit(f"Missing source-pinned release link: {path}")
          if "coverage_completeness: UNKNOWN" not in body or "defers scheduling" not in body.lower():
              raise SystemExit("The intended release limits were omitted")
          if "NOT TAGGED OR PUBLISHED" in body or "Release decision checklist" in body:
              raise SystemExit("Public release body still contains preparation-only text")
          output = Path(os.environ["RUNNER_TEMP"]) / "foundryline-v0.2.0-release.md"
          output.write_text(body.rstrip() + "\n", encoding="utf-8")
          print(f"Verified public release notes ({len(body)} characters).")
          PY

      - name: Publish exactly once and verify GitHub tag and Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A missing exact tag gives [] rather than the GET /git/ref 404.
          count="$(gh api "repos/${GH_REPO}/git/matching-refs/tags/${RELEASE_TAG}" \
            --jq '[.[] | select(.ref == "refs/tags/v0.2.0")] | length')"
          if [[ "$count" != "0" ]]; then
            echo "::error::Exact v0.2.0 tag already exists; will not retarget or republish."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::GitHub v0.2.0 Release already exists; will not publish again."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --target "$RELEASE_TARGET" \
            --title "Foundryline v0.2.0 — Three Manual Blueprints" \
            --notes-file "$RUNNER_TEMP/foundryline-v0.2.0-release.md"

          actual_tag="$(gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          test "$actual_tag" = "$RELEASE_TARGET"
          result="$(gh api "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}")"
          printf '%s\n' "$result" | jq -e --arg tag "$RELEASE_TAG" --arg target "$RELEASE_TARGET" \
            '.tag_name == $tag and .target_commitish == $target and .draft == false and .prerelease == false and .published_at != null and (.assets | length == 0) and
             (.body | contains("https://github.com/grove/foundryline/blob/v0.2.0/patterns/discover.md")) and
             (.body | contains("https://github.com/grove/foundryline/blob/v0.2.0/patterns/maintain.md")) and
             (.body | contains("https://github.com/grove/foundryline/blob/v0.2.0/patterns/deliver.md")) and
             (.body | contains("https://github.com/grove/foundryline/blob/v0.2.0/docs/maintain-v0.2-qualification-review.md")) and
             (.body | contains("https://github.com/grove/foundryline/blob/v0.2.0/docs/deliver-v0.2-qualification-review.md")) and
             (.body | contains("https://github.com/grove/foundryline/blob/v0.2.0/examples/manual-deliver/receipts/repotend-issue15-native-39123644533.zip"))' >/dev/null
          printf '%s\n' "$result" | jq '{html_url, tag_name, target_commitish, draft, prerelease, published_at}'
